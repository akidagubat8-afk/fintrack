<div id="page-add-person" class="page">

    <button class="btn back"
            onclick="showPage('people')">
        ← Back
    </button>

    <div class="title">
        Add Utang
    </div>

    <div class="subtitle">
        Record money owed to you
    </div>

    <form onsubmit="addPersonDebt(event)">

        <div class="form-group">
            <label class="form-label">
                Person Name
            </label>

            <input id="personName"
                   class="input"
                   placeholder="Enter name"
                   autocomplete="off"
                   required>
        </div>


        <div class="form-group">
            <label class="form-label">
                Payment Type
            </label>

            <select id="personPaymentType"
                    class="select"
                    onchange="togglePersonPaymentFields()">

                <option value="one-time">
                    💵 One-time Payment
                </option>

                <option value="monthly">
                    🔄 Monthly Payment
                </option>

            </select>
        </div>


        <div class="form-group">
            <label class="form-label">
                Total Amount
            </label>

            <input id="personAmount"
                   class="input"
                   type="number"
                   inputmode="decimal"
                   min="0.01"
                   step="0.01"
                   required>
        </div>


        <!-- MONTHLY ONLY -->

        <div id="personMonthlyFields"
             style="display:none;">

            <div class="form-group">

                <label class="form-label">
                    Monthly Payment
                </label>

                <input id="personMonthly"
                       class="input"
                       type="number"
                       inputmode="decimal"
                       min="0.01"
                       step="0.01"
                       placeholder="Example: 500">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Payment Start Date
                </label>

                <input id="personStart"
                       class="input"
                       type="date">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Payment End Date
                </label>

                <input id="personEnd"
                       class="input"
                       type="date">

            </div>

        </div>


        <button type="submit"
                class="btn primary full">

            💾 Save Utang

        </button>

    </form>

</div>
